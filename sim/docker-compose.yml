# Apenas o simulador é containerizado — AD-09.
# O servidor Minecraft roda nativo no Windows e conecta em localhost:8765.
services:
  sim:
    build: .
    container_name: flywire-sim
    ports:
      - "8765:8765"
    volumes:
      # data/ fica FORA do container: raw é imutável e grande demais para imagem
      - ../data:/data
    environment:
      FLYWIRE_DATA_DIR: /data
      # F20 — opt-in de telemetria (DuckDB, um arquivo por circuito em
      # data/processed/, ver docs/03-roadmap-fases.md): "" por padrão =
      # desligado; "1" = só o ocelar; "main,taste" = esses; "all" = todos.
      # Setar no ambiente do HOST antes de `docker compose up` pra ligar
      # numa sessão de calibração; não precisa editar este arquivo.
      FLYWIRE_RECORD_TELEMETRY: ${FLYWIRE_RECORD_TELEMETRY:-}
    restart: unless-stopped
